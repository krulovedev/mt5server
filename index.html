<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MT5 Monitor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <header>
    <div class="logo">MT5 MONITOR</div>
    <div class="header-right">
      <div id="clock">--:--:--</div>
      <div id="server-status" style="color: var(--muted);">WAITING</div>
    </div>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('overview', this)">ภาพรวม</button>
      <button class="tab-btn" onclick="switchTab('detail', this)">วิเคราะห์กราฟ</button>
      <button class="tab-btn" onclick="switchTab('history', this)">ประวัติข้อมูล</button>
      <button class="tab-btn" onclick="switchTab('alerts', this)">🔔 แจ้งเตือน</button>
      <button class="tab-btn" onclick="switchTab('settings', this)">ตั้งค่า</button>
    </div>
    
    <div id="tab-content-container">
        <!-- SPA loads tabs here -->
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/static/js/app.js"></script>
  <script>
    // SPA Loader Logic
    async function loadTabHTML(tabId) {
        const res = await fetch('/tabs/' + tabId + '.html');
        return await res.text();
    }
    
    window.switchTab = async function(tabId, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');
        
        const container = document.getElementById('tab-content-container');
        container.innerHTML = await loadTabHTML(tabId);
        
        // Initialize tab logic based on app.js functions
        if (tabId === 'overview') await loadOverview();
        if (tabId === 'detail') await loadDetailAccounts();
        if (tabId === 'history') await loadHistoryAccounts();
        if (tabId === 'alerts') await loadAlertsTab();
        if (tabId === 'settings') await loadSettingsTab();
    };
    
    // Initial load
    window.onload = () => switchTab('overview', document.querySelector('.tab-btn.active'));
  </script>
</body>
</html>
